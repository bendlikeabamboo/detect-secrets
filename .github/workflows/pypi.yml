# This workflow will upload a Python Package using Twine when a new tag is created.
# It uses PyPI Trusted Publishing (OIDC) — no API token required.
# Setup: https://docs.pypi.org/trusted-publishers/ (publisher = GitHub,
# repo = bendlikeabamboo/detect-secrets, workflow filename = pypi.yml,
# environment name = pypi).
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: detect-secrets-pypi

on:
  push:
    tags:
      - v*

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - run: uv sync --frozen --python ${{ matrix.python }}
    - run: uv run coverage erase
    - run: uv run coverage run -m pytest --strict-markers tests
    - run: uv run coverage report --show-missing --include=tests/* --fail-under 99
    - run: uv run coverage report --show-missing --include=testing/* --fail-under 100
    - run: uv run coverage report --show-missing --skip-covered --include=detect_secrets/* --fail-under 95
    - run: uv run ty check
    - run: uv run pre-commit run --all-files

  deploy:
    # Run tests before deploying to pypi
    needs: test
    runs-on: ubuntu-latest
    # Required for PyPI Trusted Publishing (OIDC).
    environment:
      name: pypi
      url: https://pypi.org/project/detect-secrets-plus/
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
